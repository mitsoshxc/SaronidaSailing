# Local development PostgreSQL only - never used in production.
# Start: docker compose -f deploy/dev/docker-compose.yml up -d
name: saronida-dev

services:
  postgres:
    image: postgres:18.6-alpine
    container_name: saronida-dev-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: saronida
      POSTGRES_USER: saronida
      POSTGRES_PASSWORD: saronida-dev
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - saronida-dev-pgdata:/var/lib/postgresql

volumes:
  saronida-dev-pgdata:
